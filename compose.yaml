# Example single-host deployment. Copy .env.example to .env and fill it in first (never commit it).
#   docker compose up -d --build
# Put a TLS-terminating reverse proxy in front (Caddy, nginx, Traefik); see README "Deploy".
services:
  our-story:
    build: .
    image: our-story:latest
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      OURSTORY_DATA_DIR: /data
      # Reverse proxy on the compose network? Match its address (regular expression, whole address), e.g.:
      # OURSTORY_TRUSTED_PROXIES: 172\.18\.0\.\d{1,3}
    volumes:
      - our-story-data:/data
    ports:
      # Behind a proxy on the same host keep this on loopback; publish 8080 to the world only for a quick test.
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  our-story-data:
