<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Story - dev import (TEMPORARY)</title>
<link rel="stylesheet" href="import.css">
</head>
<body>
<main>
  <div class="banner">TEMPORARY developer page. It will be replaced by the real admin UI in Phase 6.</div>
  <h1>Import from Google Photos</h1>

  <section>
    <div id="who" class="muted">Checking login...</div>
    <p>
      <a id="signin" class="btn" href="/oauth2/authorization/google" hidden>Sign in with Google</a>
      <a id="connect" class="btn" href="/oauth2/authorization/google-picker" hidden>Connect Google Photos</a>
    </p>
  </section>

  <section id="importSection" hidden>
    <button id="start" type="button">Start import</button>
    <p id="pickerBox" hidden>
      Pick your photos in Google Photos, then come back here:
      <a id="pickerLink" target="_blank" rel="noopener noreferrer">Open Google Photos picker</a>
    </p>
    <p id="message" class="muted" role="status"></p>
    <progress id="bar" max="1" value="0" hidden></progress>
    <div id="counts" class="muted"></div>
    <ul id="failures"></ul>
  </section>

  <section id="gallerySection" hidden>
    <h2>Imported photos</h2>
    <div id="grid" class="grid"></div>
  </section>
</main>

<script src="import.js" defer></script>
</body>
</html>
