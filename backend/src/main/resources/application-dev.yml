# Dev conveniences. The Vite dev server proxies /api, so no CORS is configured.
# Run with: mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
spring:
  config:
    # Dev only: read the git-ignored root .env (spring-boot:run starts in backend/, a jar may start in the root).
    # Real environment variables still win over these values. Write values unquoted: KEY=value.
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
server:
  servlet:
    session:
      cookie:
        secure: false   # the session cookie must work on plain http://localhost
ourstory:
  dev-tools:
    enabled: true       # serves the TEMPORARY /dev/import.html page
logging:
  level:
    com.ourstory: DEBUG
    org.springframework.security: DEBUG
