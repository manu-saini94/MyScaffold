server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: our-story
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:h2:file:${OURSTORY_DATA_DIR:./data}/db/ourstory
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Secrets come ONLY from environment variables. Empty means "feature not configured".
ourstory:
  data-dir: ${OURSTORY_DATA_DIR:./data}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  viewer-cookie-secret: ${VIEWER_COOKIE_SECRET:}
  admin-email: ${ADMIN_EMAIL:}
