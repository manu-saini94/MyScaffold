server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      # Secure by default: application-dev.yml is the only place that relaxes `secure` (plain http://localhost).
      timeout: 30m
      cookie:
        secure: true
        http-only: true
        same-site: lax

spring:
  application:
    name: our-story
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  http:
    client:
      connect-timeout: 10s
      read-timeout: 60s
  datasource:
    url: jdbc:h2:file:${OURSTORY_DATA_DIR:./data}/db/ourstory
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Secrets come ONLY from environment variables. Empty means "feature not configured".
ourstory:
  data-dir: ${OURSTORY_DATA_DIR:./data}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  viewer-cookie-secret: ${VIEWER_COOKIE_SECRET:}
  admin-email: ${ADMIN_EMAIL:}
  post-login-url: /admin             # where the browser lands after the admin's Google login (the admin UI)
  import-job:
    concurrency: 4
    max-download-bytes: 15728640
    max-attempts: 4
    backoff-base-millis: 500
    job-timeout: 2h          # whole job; afterwards it is FAILED (Import timed out)
    download-timeout: 2m     # reading one image body end to end
    min-free-bytes: 209715200  # refuse to write when less than 200 MB is free on the data volume
  viewer:
    # Bootstrap only (see UnlockBootstrap): stored hashed in the settings table; never commit real values.
    unlock-question: ${OURSTORY_UNLOCK_QUESTION:}
    unlock-answers: ${OURSTORY_UNLOCK_ANSWERS:}      # comma-separated
    unlock-force-reset: ${OURSTORY_UNLOCK_FORCE_RESET:false}
    # Policy defaults (see README "Viewer access"): cookie 7 days, PBKDF2 600000 iterations (peppered), 5 failures
    # per client (IPv6 /64) per 10 minutes, 30 failures overall per hour.
